<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إعداد كشّاف | Kashshaf setup</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  body { background: linear-gradient(180deg, #135BA6 0%, #082E6D 340px, var(--bg) 340px); min-height: 100vh; margin: 0; font-family: var(--font); }
  .setup { max-width: 920px; margin: 0 auto; padding: 28px 16px 48px; }
  .setup-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #fff; margin-bottom: 18px; }
  .setup-top h1 { margin: 0; font-size: 26px; }
  .setup-top p { margin: 4px 0 0; opacity: .9; line-height: 1.8; font-size: 14px; }
  .setup-card { background: #fff; border-radius: 18px; box-shadow: var(--shadow); padding: 20px 22px; }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 18px; padding: 0; list-style: none; counter-reset: s; }
  .steps li { background: var(--sky-2); border: 1px solid #dbe6f5; border-radius: 12px; padding: 10px 12px; font-size: 12.5px; line-height: 1.7; color: var(--ink-2); counter-increment: s; }
  .steps li::before { content: counter(s); display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; font-weight: 800; font-size: 12px; margin-inline-end: 6px; }
  .lang { background: #ffffff22; color: #fff; border: 1px solid #ffffff55; border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
  .done { text-align: center; padding: 30px 10px; }
  .done h2 { color: var(--navy); }
  @media (max-width: 640px) { .steps { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="setup">
  <div class="setup-top">
    <div><h1 id="h1"></h1><p id="lead"></p></div>
    <button class="lang" id="lang" type="button"></button>
  </div>
  <div class="setup-card">
    <ol class="steps" id="steps"></ol>
    <div id="form"><div class="sk-card">
      <span class="sk sk-line lg" style="width:35%"></span><span class="sk sk-line" style="width:80%"></span>
      <span class="sk" style="height:38px;border-radius:10px;margin-top:12px"></span><span class="sk" style="height:38px;border-radius:10px;margin-top:12px"></span>
    </div></div>
  </div>
</main>
<script src="/assets/keys.js"></script>
<script>
(function () {
  const TXT = {
    ar: { h1: "إعداد كشّاف", lead: "أول تشغيل: أدخل مفاتيح خدماتك ليعمل النظام على قاعدة بياناتك. هذه الصفحة تفتح فقط على هذا الجهاز.",
      steps: ["أنشئ مشروعاً مجانياً في supabase.com.", "في SQL Editor شغّل ملفات supabase/migrations بالترتيب.", "انسخ الرابط والمفتاحين هنا، واضغط اختبار الاتصال ثم حفظ."],
      lang: "English", done: "تم الحفظ. يعيد كشّاف التشغيل الآن…", ready: "جاهز! جارٍ فتح لوحة التحكم…" },
    en: { h1: "Kashshaf setup", lead: "First run: enter your service keys so the system runs on your own database. This page opens only on this computer.",
      steps: ["Create a free project at supabase.com.", "In the SQL Editor, run the files in supabase/migrations in order.", "Paste the URL and both keys here, test the connection, then save."],
      lang: "العربية", done: "Saved. Kashshaf is restarting…", ready: "Ready! Opening the dashboard…" },
  };
  let lang = "ar"; try { lang = localStorage.getItem("kashshaf.lang") === "en" ? "en" : "ar"; } catch (e) { /* storage off */ }
  let fields = null;
  async function call(path, body) {
    const res = await fetch(path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json();
    if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { body: data });
    return data;
  }
  function paint() {
    const x = TXT[lang];
    document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.getElementById("h1").textContent = x.h1; document.getElementById("lead").textContent = x.lead;
    document.getElementById("lang").textContent = x.lang;
    document.getElementById("steps").innerHTML = x.steps.map((s) => `<li>${s}</li>`).join("");
    if (fields) window.KashshafKeys.mount(document.getElementById("form"), {
      fields, lang,
      test: (group, values) => call("/api/setup/test", { group, values }),
      save: (values) => call("/api/setup/save", { values }),
      onSaved: () => waitForServer(),
    });
  }
  async function waitForServer() {
    const box = document.getElementById("form");
    box.innerHTML = `<div class="done"><h2>${TXT[lang].done}</h2><span class="sk sk-line" style="width:50%;margin:16px auto"></span></div>`;
    for (let i = 0; i < 90; i++) {
      await new Promise((r) => setTimeout(r, 1000));
      try { // the real server answers /api/config; the setup server answers 503
        const r = await fetch("/api/config", { cache: "no-store" });
        if (r.ok) { box.querySelector("h2").textContent = TXT[lang].ready; location.href = "/"; return; }
      } catch (e) { /* restarting */ }
    }
  }
  document.getElementById("lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("kashshaf.lang", lang); } catch (e) { /* storage off */ } paint(); };
  paint();
  call("/api/setup").then((r) => { fields = r.fields; paint(); })
    .catch((e) => { document.getElementById("form").innerHTML = `<p class="msg err">${e.message}</p>`; });
})();
</script>
</body>
</html>
