<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غرفة العمليات | كشّاف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/room.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg class="shield" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 3 7 12v18c0 16 10.5 27.5 25 31 14.5-3.5 25-15 25-31V12L32 3z" fill="#135BA6"/>
      <path d="M32 8.5 12 16v14c0 13 8.5 22.5 20 25.5 11.5-3 20-12.5 20-25.5V16L32 8.5z" fill="#082E6D"/>
      <path d="M32 18l3.6 7.4 8.1 1.2-5.9 5.7 1.4 8.1L32 36.6l-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z" fill="#fff"/>
    </svg>
    <div><b>شرطة أبوظبي</b><small>ABU DHABI POLICE</small></div>
  </div>
  <h1>غرفة العمليات <span>كشّاف · رصد الاحتيال على مدار الساعة</span></h1>
  <span class="mode" id="mode" role="status">…</span>
  <a class="back" href="/">لوحة المحللين ←</a>
</header>

<main class="room">
  <!-- The big wall screen the agents face -->
  <section class="wall" aria-label="الشاشة الرئيسية">
    <div class="wall-kpis" id="kpis"></div>
    <div class="ticker" id="ticker" aria-live="polite"></div>
    <div class="feed-head"><span>آخر 10 نتائج</span>
      <label>الترتيب <select id="sortOrder">
        <option value="new">الأحدث أولاً</option>
        <option value="old">الأقدم أولاً</option>
        <option value="risk">الأخطر أولاً</option>
      </select></label></div>
    <ol class="feed" id="feed" aria-label="آخر الأحكام"></ol>
  </section>

  <!-- Amphitheater -->
  <section class="hall" aria-label="الوكلاء">
    <svg id="hall" role="img" aria-label="مدرج الوكلاء"></svg>
    <div class="legend">
      <span><i class="lg working"></i>يفحص رابطاً</span>
      <span><i class="lg idle"></i>بانتظار رابط</span>
      <span><i class="lg hit"></i>وجد احتيالاً</span>
      <span><i class="lg paused"></i>متوقف</span>
    </div>
  </section>

  <!-- Controls -->
  <section class="console" aria-label="التحكم">
    <div class="count">
      <label for="count">عدد الوكلاء</label>
      <input id="count" type="number" min="1" max="500" value="50" inputmode="numeric">
    </div>
    <button class="go" id="patrolBtn" type="button">▶ تشغيل الدورية المستمرة</button>
    <button class="stop" id="stopBtn" type="button">■ إيقاف كل الوكلاء</button>
    <div class="meters" id="meters"></div>
    <p class="msg" id="msg" role="alert"></p>
  </section>
</main>

<script src="/assets/room.js"></script>
</body>
</html>
