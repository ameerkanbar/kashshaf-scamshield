<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كشّاف | شرطة أبوظبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="shield" viewBox="0 0 64 64">
    <path d="M32 3 7 12v18c0 16 10.5 27.5 25 31 14.5-3.5 25-15 25-31V12L32 3z" fill="#135BA6"/>
    <path d="M32 8.5 12 16v14c0 13 8.5 22.5 20 25.5 11.5-3 20-12.5 20-25.5V16L32 8.5z" fill="#082E6D"/>
    <path d="M32 18l3.6 7.4 8.1 1.2-5.9 5.7 1.4 8.1L32 36.6l-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z" fill="#fff"/>
  </symbol>
</svg>

<!-- ============ Login ============ -->
<section id="login" class="login" hidden>
  <div class="login-art" aria-hidden="true">
    <div class="radar big"><div class="sweep"></div><i></i><i></i><i></i></div>
  </div>
  <div class="login-side">
    <button class="lang-btn on-dark" data-lang-toggle type="button"></button>
    <div class="login-pitch">
      <div class="brand-row"><svg class="shield"><use href="#shield"/></svg><div><b data-i18n="org"></b><small data-i18n="orgEn"></small></div></div>
      <h1 data-i18n="brand"></h1>
      <p class="pitch" data-i18n="hero.title"></p>
      <ul class="ticks"><li data-i18n="login.tag1"></li><li data-i18n="login.tag2"></li><li data-i18n="login.tag3"></li></ul>
    </div>
    <form id="loginForm" class="login-card">
      <h2 data-i18n="login.title"></h2>
      <p class="muted" data-i18n="login.sub"></p>
      <a class="btn btn-uaepass block" href="/auth/uaepass/start" data-i18n="login.uaepass"></a>
      <p class="muted small uaepass-note" data-i18n="login.uaepassNote"></p>
      <div class="or"><span data-i18n="login.or"></span></div>
      <label class="field"><span data-i18n="login.email"></span><input type="email" id="email" required autocomplete="username" dir="ltr"></label>
      <label class="field"><span data-i18n="login.password"></span><input type="password" id="password" required autocomplete="current-password" dir="ltr"></label>
      <button class="btn primary block" type="submit" id="loginBtn" data-i18n="login.submit"></button>
      <p class="error" id="loginError" role="alert"></p>
    </form>
  </div>
</section>

<!-- ============ App ============ -->
<div id="app" class="shell" hidden>
  <aside class="side" id="side" aria-label="Main menu">
    <div class="side-brand"><svg class="shield"><use href="#shield"/></svg><div><b data-i18n="brand"></b><small data-i18n="org"></small></div></div>
    <nav class="nav" id="nav">
      <span class="nav-group" data-i18n="nav.main"></span>
      <a href="#ops" data-page="ops"><i data-icon="radar"></i><span data-i18n="nav.ops"></span><em class="live-dot"></em></a>
      <a href="#org" data-page="org"><i data-icon="org"></i><span data-i18n="nav.org"></span></a>
      <a href="#analytics" data-page="analytics"><i data-icon="chart"></i><span data-i18n="nav.analytics"></span></a>
      <span class="nav-group" data-i18n="nav.investigate"></span>
      <a href="#scan" data-page="scan"><i data-icon="scan"></i><span data-i18n="nav.scan"></span></a>
      <a href="#findings" data-page="findings"><i data-icon="list"></i><span data-i18n="nav.findings"></span></a>
      <a href="#review" data-page="review"><i data-icon="review"></i><span data-i18n="nav.review"></span><em class="count warn" id="navReview"></em></a>
      <a href="#blocked" data-page="blocked"><i data-icon="block"></i><span data-i18n="nav.blocked"></span><em class="count" id="navBlocked"></em></a>
      <a href="#gangs" data-page="gangs"><i data-icon="link"></i><span data-i18n="nav.gangs"></span></a>
      <span class="nav-group" data-i18n="nav.system"></span>
      <a href="#discover" data-page="discover"><i data-icon="globe"></i><span data-i18n="nav.discover"></span></a>
      <a href="#agents" data-page="agents"><i data-icon="users"></i><span data-i18n="nav.agents"></span></a>
      <a href="#audit" data-page="audit"><i data-icon="log"></i><span data-i18n="nav.audit"></span></a>
      <a href="#settings" data-page="settings"><i data-icon="gear"></i><span data-i18n="nav.settings"></span><em class="count warn" id="navSettings"></em></a>
    </nav>
    <div class="side-foot">
      <div class="me"><span class="avatar" id="avatar"></span><span id="userEmail" dir="ltr"></span></div>
      <button class="btn ghost-dark block" id="logout" type="button"><i data-icon="out"></i><span data-i18n="logout"></span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" data-i18n-aria="menu"><i data-icon="menu"></i></button>
      <div class="title"><h1 id="pageTitle"></h1><p id="pageSub"></p></div>
      <div class="chips" id="chips"></div>
      <label class="sort"><span data-i18n="sort"></span>
        <select id="sortOrder"><option value="new" data-i18n="sort.new"></option><option value="old" data-i18n="sort.old"></option><option value="risk" data-i18n="sort.risk"></option></select>
      </label>
      <button class="lang-btn" data-lang-toggle type="button"></button>
    </header>

    <main class="content">

      <!-- Operations room -->
      <section data-view="ops">
        <div class="hero">
          <div class="hero-grid" aria-hidden="true"></div>
          <div class="hero-text">
            <span class="kicker"><em class="live-dot"></em><span data-i18n="hero.kicker"></span></span>
            <h2 data-i18n="hero.title"></h2>
            <p id="heroText"></p>
            <div class="hero-actions">
              <label class="count-in"><span data-i18n="hero.count"></span><input type="number" id="heroCount" min="1" max="500" value="50"></label>
              <button class="btn light" id="patrolBtn" type="button"><i data-icon="play"></i><span data-i18n="hero.patrol"></span></button>
              <button class="btn danger" id="stopBtn" type="button"><i data-icon="stop"></i><span data-i18n="hero.stop"></span></button>
              <button class="btn light" id="startBtn" type="button" hidden><i data-icon="play"></i><span data-i18n="hero.start"></span></button>
            </div>
            <p class="hero-msg" id="heroMsg" role="status"></p>
          </div>
          <div class="hero-radar">
            <div class="radar" id="radar"><div class="sweep"></div><i></i><i></i><i></i><div class="radar-core"><svg class="shield"><use href="#shield"/></svg><span data-i18n="radar.center"></span></div><div id="blips"></div></div>
            <div class="radar-legend" id="radarLegend"></div>
          </div>
        </div>

        <div class="card pipeline">
          <div class="card-head"><h3 data-i18n="pipe.title"></h3></div>
          <div class="pipe" id="pipe">
            <div class="stage" data-stage="discover"><i data-icon="globe"></i><b data-n>0</b><span data-i18n="pipe.discover"></span><small data-i18n="pipe.discover.d"></small></div>
            <div class="flow" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="stage" data-stage="queue"><i data-icon="queue"></i><b data-n>0</b><span data-i18n="pipe.queue"></span><small data-i18n="pipe.queue.d"></small></div>
            <div class="flow" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="stage" data-stage="check"><i data-icon="users"></i><b data-n>0</b><span data-i18n="pipe.check"></span><small data-i18n="pipe.check.d"></small></div>
            <div class="flow" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="stage danger" data-stage="verdict"><i data-icon="alert"></i><b data-n>0</b><span data-i18n="pipe.verdict"></span><small data-i18n="pipe.verdict.d"></small></div>
            <div class="flow" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="stage good" data-stage="block"><i data-icon="shield"></i><b data-n>0</b><span data-i18n="pipe.block"></span><small data-i18n="pipe.block.d"></small></div>
          </div>
        </div>

        <div class="kpis" id="opsKpis"></div>

        <div class="grid g-2-1">
          <div class="card">
            <div class="card-head"><div><h3 data-i18n="org.depts"></h3><p data-i18n="org.depts.sub"></p></div>
              <a class="btn primary sm" href="#org"><i data-icon="org"></i><span data-i18n="org.button"></span></a></div>
            <div class="dept-sum" id="deptSum"></div>
          </div>
          <div class="card">
            <div class="card-head"><div><h3 data-i18n="feed.title"></h3><p data-i18n="feed.sub"></p></div><em class="live-dot"></em></div>
            <ol class="feed" id="feed"></ol>
          </div>
        </div>

        <div class="grid g-2-1">
          <div class="card">
            <div class="card-head"><div><h3 data-i18n="chart.activity"></h3><p data-i18n="chart.activity.sub"></p></div></div>
            <div class="chart-box tall"><canvas id="chActivityOps"></canvas></div>
          </div>
          <div class="card">
            <div class="card-head"><div><h3 data-i18n="patrol.title"></h3></div></div>
            <div class="patrol" id="patrolLast"></div>
            <div class="card-head sub"><h3 data-i18n="spend.title"></h3></div>
            <div id="spend"></div>
          </div>
        </div>
      </section>

      <!-- Agent company -->
      <section data-view="org" hidden>
        <div class="live-cta"><div><b data-i18n="live.cta"></b><p data-i18n="live.cta.d"></p></div>
          <a class="btn primary" href="#live"><em class="live-dot"></em><span data-i18n="live.button"></span></a></div>
        <div class="kpis" id="orgKpis"></div>
        <div class="org-tree">
          <div class="chief-card" id="chiefCard"></div>
          <div class="org-bus" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="depts" id="depts"></div>
        </div>
        <div class="card">
          <div class="card-head"><div><h3 data-i18n="org.cases"></h3><p data-i18n="org.cases.sub"></p></div></div>
          <div class="cases" id="cases"></div>
          <p class="note" data-i18n="org.skipwhy" style="margin:12px 0 0"></p>
        </div>
      </section>

      <!-- Live view: the whole company at work -->
      <section data-view="live" hidden>
        <div class="live-bar">
          <a class="btn outline sm" href="#org"><span data-i18n="live.back"></span></a>
          <div class="live-stats" id="liveStats"></div>
          <div class="live-legend" id="liveLegend"></div>
        </div>
        <p class="note" data-i18n="live.note"></p>
        <div class="floor" id="floor"></div>
      </section>

      <!-- Settings: connected services and runtime settings -->
      <section data-view="settings" hidden>
        <div class="card set-top">
          <div class="set-sum" id="setSummary"></div>
          <div class="set-actions">
            <button class="btn primary" id="keysBtn" type="button"><i data-icon="key"></i><span data-i18n="set.keys"></span></button>
            <button class="btn outline" id="setRefresh" type="button"><i data-icon="refresh"></i><span data-i18n="set.refresh"></span></button>
          </div>
        </div>
        <div class="card-head"><div><h3 data-i18n="set.services"></h3><p data-i18n="set.services.d"></p></div></div>
        <div class="services" id="services"></div>
        <div class="card">
          <div class="card-head"><div><h3 data-i18n="set.config"></h3><p data-i18n="set.config.d"></p></div></div>
          <div class="table-wrap"><table class="table"><tbody id="configBody"></tbody></table></div>
        </div>
      </section>

      <!-- Analytics -->
      <section data-view="analytics" hidden>
        <div class="kpis" id="anKpis"></div>
        <div class="grid g-1-1">
          <div class="card"><div class="card-head"><div><h3 data-i18n="chart.verdicts"></h3><p data-i18n="chart.verdicts.sub"></p></div></div><div class="chart-box"><canvas id="chVerdicts"></canvas></div><details class="tbl"><summary data-i18n="chart.table"></summary><div id="tblVerdicts"></div></details></div>
          <div class="card"><div class="card-head"><div><h3 data-i18n="chart.first"></h3><p data-i18n="chart.first.sub"></p></div></div><div class="chart-box"><canvas id="chFirst"></canvas></div><details class="tbl"><summary data-i18n="chart.table"></summary><div id="tblFirst"></div></details></div>
        </div>
        <div class="card"><div class="card-head"><div><h3 data-i18n="chart.activity"></h3><p data-i18n="chart.activity.sub"></p></div></div><div class="chart-box tall"><canvas id="chActivity"></canvas></div></div>
        <div class="grid g-1-1">
          <div class="card"><div class="card-head"><div><h3 data-i18n="chart.entities"></h3><p data-i18n="chart.entities.sub"></p></div></div><div class="chart-box"><canvas id="chEntities"></canvas></div><details class="tbl"><summary data-i18n="chart.table"></summary><div id="tblEntities"></div></details></div>
          <div class="card"><div class="card-head"><div><h3 data-i18n="chart.sources"></h3><p data-i18n="chart.sources.sub"></p></div></div><div class="chart-box"><canvas id="chSources"></canvas></div><details class="tbl"><summary data-i18n="chart.table"></summary><div id="tblSources"></div></details></div>
        </div>
      </section>

      <!-- Scan -->
      <section data-view="scan" hidden>
        <div class="grid g-2-1">
          <div class="card">
            <label class="field"><span data-i18n="scan.label"></span><textarea id="scanText" rows="6" data-i18n-ph="scan.ph"></textarea></label>
            <div class="row"><button class="btn primary" id="scanBtn" type="button"><i data-icon="send"></i><span data-i18n="scan.send"></span></button><span class="msg" id="scanMsg" role="alert"></span></div>
          </div>
          <div class="card how">
            <h3 data-i18n="scan.how"></h3>
            <ol class="steps"><li data-i18n="scan.how1"></li><li data-i18n="scan.how2"></li><li data-i18n="scan.how3"></li><li data-i18n="scan.how4"></li></ol>
          </div>
        </div>
        <div class="card" id="scanResult" aria-live="polite" hidden></div>

        <!-- Import a file of links: each one gets the full check; labels (if any) give precision and recall -->
        <div class="card" id="importPanel">
          <div class="card-head"><div><h3 data-i18n="imp.title"></h3><p data-i18n="imp.desc"></p></div></div>
          <label class="dropzone" id="dropzone">
            <input type="file" id="importFile" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.json" hidden>
            <i data-icon="upload"></i>
            <b data-i18n="imp.drop"></b>
            <span class="muted" data-i18n="imp.limit"></span>
          </label>
          <p class="msg" id="importMsg" role="alert"></p>
          <div id="importResult" aria-live="polite" hidden></div>
        </div>
      </section>

      <!-- Review: suspicious sites, blocked until an analyst decides -->
      <section data-view="review" hidden>
        <p class="note review-note" data-i18n="rev.note"></p>
        <div class="results" id="reviewBody" role="list"></div>
      </section>

      <!-- Findings -->
      <section data-view="findings" hidden>
        <div class="card">
          <div class="filters"><div class="search"><i data-icon="search"></i><input id="search" type="search" data-i18n-ph="f.search" dir="auto"></div>
            <select id="verdictFilter"><option value="" data-i18n="f.all"></option><option value="fraud" data-i18n="v.fraud"></option><option value="suspicious" data-i18n="v.suspicious"></option><option value="review" data-i18n="f.review"></option><option value="safe" data-i18n="v.safe"></option><option value="official" data-i18n="v.official"></option><option value="unreachable" data-i18n="v.unreachable"></option></select></div>
          <div class="table-wrap"><table class="table"><thead><tr><th data-i18n="col.verdict"></th><th data-i18n="col.time"></th><th data-i18n="col.url"></th><th data-i18n="col.entity"></th><th data-i18n="col.source"></th><th data-i18n="col.blocked"></th><th></th></tr></thead><tbody id="findingsBody"></tbody></table></div>
        </div>
      </section>

      <!-- Blocked -->
      <section data-view="blocked" hidden>
        <div class="card">
          <p class="note" data-i18n="blocked.note"></p>
          <div class="filters"><div class="search"><i data-icon="search"></i><input id="blockedSearch" type="search" data-i18n-ph="blocked.search" dir="auto"></div>
            <button class="btn outline" id="exportBtn" type="button"><i data-icon="download"></i><span data-i18n="blocked.csv"></span></button></div>
          <div class="table-wrap wide"><table class="table"><thead><tr><th data-i18n="col.blockedAt"></th><th data-i18n="col.domain"></th><th data-i18n="col.entity"></th><th data-i18n="col.score"></th><th data-i18n="col.links"></th><th data-i18n="col.sightings"></th><th data-i18n="col.first"></th><th data-i18n="col.last"></th><th data-i18n="col.decision"></th></tr></thead><tbody id="blockedBody"></tbody></table></div>
        </div>
      </section>

      <!-- Gangs -->
      <section data-view="gangs" hidden>
        <p class="note" data-i18n="gangs.note"></p>
        <div class="gangs" id="gangsList"></div>
      </section>

      <!-- Discovery -->
      <section data-view="discover" hidden>
        <div class="card run-state" id="searchRun"></div>
        <div class="grid g-1-1">
          <div class="card"><h3 data-i18n="disc.google"></h3><p class="muted" data-i18n="disc.google.d"></p>
            <div class="row"><input id="googleQuery" class="grow" data-i18n-ph="disc.query" dir="auto"><select id="googleLang"><option value="ar">العربية</option><option value="en">English</option></select><button class="btn primary" id="googleBtn" type="button" data-i18n="disc.search"></button></div>
            <button class="btn outline" data-discover="google" type="button" data-i18n="disc.residents"></button></div>
          <div class="card sources">
            <div class="source"><i data-icon="cert"></i><div><b data-i18n="disc.ct"></b><p class="muted" data-i18n="disc.ct.d"></p></div><button class="btn outline" data-discover="ct" type="button" data-i18n="disc.run"></button></div>
            <div class="source"><i data-icon="fish"></i><div><b data-i18n="disc.feed"></b><p class="muted" data-i18n="disc.feed.d"></p></div><button class="btn outline" data-discover="feed" type="button" data-i18n="disc.run"></button></div>
          </div>
        </div>
        <p class="msg" id="discoverMsg" role="status"></p>
        <div class="card"><div class="card-head"><div><h3 data-i18n="disc.log"></h3><p data-i18n="disc.log.d"></p></div></div>
          <div class="table-wrap"><table class="table"><thead><tr><th data-i18n="col.time"></th><th data-i18n="col.type"></th><th data-i18n="col.query"></th><th data-i18n="col.new"></th><th data-i18n="col.known"></th><th data-i18n="col.blockedNow"></th><th data-i18n="col.by"></th></tr></thead><tbody id="searchLogBody"></tbody></table></div></div>
      </section>

      <!-- Agents -->
      <section data-view="agents" hidden>
        <div class="card">
          <div class="row"><label class="count-in dark"><span data-i18n="hero.count"></span><input type="number" id="agentCount" min="1" max="500" value="50"></label>
            <button class="btn outline" id="resizeBtn" type="button" data-i18n="ag.apply"></button>
            <button class="btn danger" id="stopBtn2" type="button"><i data-icon="stop"></i><span data-i18n="hero.stop"></span></button>
            <button class="btn primary" id="startBtn2" type="button" hidden><i data-icon="play"></i><span data-i18n="hero.start"></span></button>
            <span class="msg" id="agentsMsg" role="status"></span></div>
          <div class="kpis small" id="agKpis"></div>
          <div class="table-wrap"><table class="table"><thead><tr><th data-i18n="col.agent"></th><th data-i18n="col.dept"></th><th data-i18n="col.role"></th><th data-i18n="col.status"></th><th data-i18n="col.done"></th><th data-i18n="col.hits"></th><th data-i18n="col.job"></th><th data-i18n="col.since"></th><th data-i18n="col.lastDone"></th></tr></thead><tbody id="agentsBody"></tbody></table></div>
        </div>
      </section>

      <!-- Audit -->
      <section data-view="audit" hidden>
        <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th data-i18n="col.time"></th><th data-i18n="col.user"></th><th data-i18n="col.action"></th><th data-i18n="col.target"></th></tr></thead><tbody id="auditBody"></tbody></table></div></div>
      </section>
    </main>
  </div>
</div>

<dialog id="detail" class="detail"><div id="detailBody"></div></dialog>
<dialog id="keysDlg" class="detail keys-dlg" aria-labelledby="keysTitle">
  <div class="detail-head"><div><b id="keysTitle" data-i18n="keys.title"></b><small data-i18n="keys.sub"></small></div><button class="btn ghost-dark sm" id="keysClose" type="button" data-i18n="close"></button></div>
  <div class="detail-body" id="keysBody"></div>
  <div class="keys-restart" id="keysRestart" hidden><span data-i18n="keys.restartNote"></span><button class="btn outline sm" id="keysRestartBtn" type="button" data-i18n="keys.restartBtn"></button></div>
</dialog>

<script src="/assets/hq/chars.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/keys.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
